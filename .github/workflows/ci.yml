name: CI

# Runs on every pull request and every push to main (i.e. alongside each
# deploy). Uses only GitHub-hosted runners and a throwaway Postgres service
# container — no paid services, no real third-party credentials.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older run to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type check & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check & build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cikka
          POSTGRES_PASSWORD: cikka
          POSTGRES_DB: cikka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cikka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cikka:cikka@localhost:5432/cikka_test
      # Test-only values; never used outside CI.
      JWT_SECRET: ci-test-jwt-secret-000000000000000000000000
      JWT_SELLER_SECRET: ci-test-seller-secret-0000000000000000000
      JWT_USER_SECRET: ci-test-user-secret-00000000000000000000
      EXTERNAL_SERVICES_MODE: stub
      HUBBLE_MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test
