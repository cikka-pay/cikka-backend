name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Spin up Postgres as a service container — mirrors docker-compose.yml credentials
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cikka
          POSTGRES_PASSWORD: cikka_dev
          POSTGRES_DB: cikka_dashboard
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cikka -d cikka_dashboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://cikka:cikka_dev@localhost:5433/cikka_dashboard?schema=public"
      JWT_SECRET: "ci-test-secret-do-not-use-in-production"
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: TypeScript type check
        run: npm run build

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
