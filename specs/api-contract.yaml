openapi: 3.1.0
info:
  title: Cikka Seller API
  version: 1.0.0
  description: API for the Cikka Seller Dashboard
servers:
  - url: http://localhost:4000/api
    description: Local Dev Server
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    BillpayWebhookApiKey:
      type: apiKey
      in: header
      name: X-BILL-WEBHOOK-API-KEY
      description: Key emailed by Setu; compared against SETU_BILLPAY_WEBHOOK_API_KEY.
  schemas:
    PricingError:
      type: object
      properties:
        success: { type: boolean, const: false }
        error: { type: string }
        code:
          type: string
          enum: [EMPTY_CART, INVALID_QTY, UNKNOWN_PRODUCT, PRODUCT_UNAVAILABLE, VARIANT_MISMATCH, INSUFFICIENT_STOCK,
                 SELLER_NOT_PAYABLE, COUPON_INVALID, AUTH_REQUIRED_FOR_CASHBACK, EXCHANGE_NOT_ELIGIBLE, EXCHANGE_SINGLE_ITEM,
                 PRICE_CHANGED, NO_PAYMENT_REQUIRED, AMOUNT_TOO_SMALL, AUTH_REQUIRED]
        quote: { $ref: "#/components/schemas/MallQuote" }
    MallCartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, qty]
            properties:
              productId: { type: string, description: "Alias: id, product_id" }
              variantId: { type: [string, "null"] }
              qty: { type: integer, minimum: 1, maximum: 20 }
        deliveryOption: { type: string, enum: [standard, express], description: "Alias: delivery_option" }
        couponCode: { type: [string, "null"], description: "No server coupons exist: any value is rejected (COUPON_INVALID)" }
        useCashback: { type: boolean, description: "Alias: apply_cashback. Needs a user JWT." }
        useCiPoints: { type: boolean, description: "Accepted but CI Points are not redeemable on mall orders" }
        exchange:
          type: [object, "null"]
          properties:
            orderId: { type: string }
            orderNumber: { type: string }
    MallQuote:
      type: object
      properties:
        quote_id: { type: string, description: "HMAC-signed, valid 10 minutes, bound to the user" }
        quote_hash: { type: string }
        expires_at: { type: string, format: date-time }
        currency: { type: string, const: INR }
        delivery_option: { type: string, enum: [standard, express] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string }
              variant_id: { type: [string, "null"] }
              variant: { type: [string, "null"] }
              name: { type: string }
              brand: { type: [string, "null"] }
              seller_id: { type: string }
              qty: { type: integer }
              unit_price: { type: number }
              unit_price_paise: { type: integer }
              mrp: { type: [number, "null"] }
              line_total: { type: number }
              line_total_paise: { type: integer }
              line_mrp_total: { type: number }
              mrp_savings: { type: number }
        subtotal: { type: number }
        subtotal_paise: { type: integer }
        mrp_total: { type: number }
        mrp_savings: { type: number }
        discounts:
          type: object
          properties:
            coupon: { type: number }
            cashback: { type: number }
            ci_points: { type: number }
            total: { type: number }
            total_paise: { type: integer }
        fees:
          type: object
          properties:
            express_delivery_fee: { type: number }
            platform_fee: { type: number }
            platform_fee_gst: { type: number }
            platform_fee_total: { type: number }
        exchange:
          type: [object, "null"]
          properties:
            order_id: { type: string }
            order_number: { type: string }
            credit: { type: number }
            refund_due: { type: number }
        cashback_balance: { type: [number, "null"] }
        total: { type: number }
        total_paise: { type: integer }
        requires_payment: { type: boolean }
        notes: { type: array, items: { type: string } }
    ExchangeEligibility:
      type: object
      properties:
        success: { type: boolean }
        eligible: { type: boolean }
        reasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        order_id: { type: [string, "null"] }
        order_number: { type: [string, "null"] }
        credit: { type: number }
        new_product_id: { type: [string, "null"] }
        new_variant_id: { type: [string, "null"] }
        new_price: { type: [number, "null"] }
        amount_due: { type: number }
        amount_due_paise: { type: integer }
        refund_due: { type: number }
        requires_payment: { type: boolean }
        same_seller: { type: [boolean, "null"] }
    UserOrder:
      type: object
      properties:
        id: { type: string, description: Order number }
        internalId: { type: string }
        title: { type: string }
        brand: { type: string }
        image: { type: string }
        price: { type: string }
        totalAmount: { type: number }
        date: { type: string, format: date-time }
        status: { type: string }
        statusText: { type: string }
        statusSubtext: { type: string }
        courier: { type: string }
        trackingNumber: { type: string }
        canCancel: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              productId: { type: string }
              name: { type: string }
              quantity: { type: integer }
              unitPrice: { type: number }
    SavedCard:
      type: object
      properties:
        id: { type: string }
        tokenId: { type: string, description: Razorpay token id (token_*) }
        bankName: { type: string }
        cardNetwork: { type: string }
        cardType: { type: string }
        last4: { type: string }
        expiryMonth: { type: [string, "null"] }
        expiryYear: { type: [string, "null"] }
        isDefault: { type: boolean }
        status: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    SellerProfile:
      type: object
      properties:
        id:
          type: string
        phone:
          type: string
        email:
          type: string
        businessName:
          type: string
        kycVerified:
          type: boolean
        onboardingStatus:
          type: string
          enum: [INCOMPLETE, SUBMITTED, UNDER_REVIEW, VERIFIED, REJECTED]
        onboarding:
          type: object
    BillpayErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        code:
          type: string
          enum: [USER_NOT_FOUND, PHONE_NOT_VERIFIED, INVALID_PHONE, SETU_UNAVAILABLE]
        traceId:
          type: string
          description: Setu trace id, present on some 502s
      required: [success, error]
    BillpayHistoryItem:
      type: object
      description: >-
        One BBPS bill payment recorded from Setu BillPay webhooks. Money fields are
        Decimal(10,2) serialised as fixed 2-decimal strings (e.g. "601.00").
      properties:
        id:
          type: string
        setuOrderId:
          type: [string, "null"]
        bbpsTxnId:
          type: [string, "null"]
        refId:
          type: [string, "null"]
        billerId:
          type: [string, "null"]
        billerName:
          type: [string, "null"]
        category:
          type: [string, "null"]
        mobileNumber:
          type: [string, "null"]
        billAmount:
          type: [string, "null"]
          example: "601.00"
        amountPaid:
          type: [string, "null"]
          example: "601.00"
        status:
          type: string
          enum: [PENDING, SUCCESS, FAILED, REFUNDED]
        paidOn:
          type: [string, "null"]
          format: date-time
        errorCode:
          type: [string, "null"]
        errorMessage:
          type: [string, "null"]
        disputeRefId:
          type: [string, "null"]
        disputeStatus:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, status, createdAt, updatedAt]
security:
  - BearerAuth: []
paths:
  /auth/signup/send-phone-otp:
    post:
      tags: [Auth]
      summary: Send OTP for phone verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
              required: [phone]
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/signup/verify-phone-otp:
    post:
      tags: [Auth]
      summary: Verify phone OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
              required: [phone, otp]
      responses:
        "200":
          description: Phone verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  signupToken:
                    type: string
  /auth/signup/send-email-otp:
    post:
      tags: [Auth]
      summary: Send OTP for email verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required: [email]
      responses:
        "200":
          description: OTP sent
        "400":
          description: Email in use
  /auth/signup/verify-email-otp:
    post:
      tags: [Auth]
      summary: Verify email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                otp:
                  type: string
              required: [email, otp]
      responses:
        "200":
          description: Email verified
  /auth/signup/set-password:
    post:
      tags: [Auth]
      summary: Set password and finalize signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  seller:
                    $ref: "#/components/schemas/SellerProfile"
  /auth/signin/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP for signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
              required: [phone]
      responses:
        "200":
          description: OTP sent
  /auth/signin/verify-otp:
    post:
      tags: [Auth]
      summary: Verify signin OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
              required: [phone, otp]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  seller:
                    $ref: "#/components/schemas/SellerProfile"
  /auth/forgot-password/send-otp:
    post:
      tags: [Auth]
      summary: Send forgot password OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
              required: [phone]
      responses:
        "200":
          description: OTP sent
  /auth/forgot-password/verify-otp:
    post:
      tags: [Auth]
      summary: Verify forgot password OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
              required: [phone, otp]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  resetToken:
                    type: string
  /auth/forgot-password/reset:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required: [password]
      responses:
        "200":
          description: Password reset successfully
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
  /onboarding:
    get:
      tags: [Onboarding]
      summary: Get onboarding state
      responses:
        "200":
          description: Onboarding state
  /onboarding/submit:
    post:
      tags: [Onboarding]
      summary: Submit onboarding application
      responses:
        "200":
          description: Success
  /onboarding/step/1:
    patch:
      tags: [Onboarding]
      summary: Update Step 1 (Business Info)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /onboarding/step/2:
    patch:
      tags: [Onboarding]
      summary: Update Step 2 (Legal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /onboarding/kyb/verify-gst:
    post:
      tags: [Onboarding]
      summary: Verify GST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gstNumber:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/kyb/verify-pan:
    post:
      tags: [Onboarding]
      summary: Verify PAN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                panNumber:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/kyb/verify-cin:
    post:
      tags: [Onboarding]
      summary: Verify CIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cinNumber:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/step/3:
    patch:
      tags: [Onboarding]
      summary: Update Step 3 (Authorized Signatory)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /onboarding/kyb/send-aadhaar-otp:
    post:
      tags: [Onboarding]
      summary: Send Aadhaar OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aadhaarNumber:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/kyb/verify-aadhaar-otp:
    post:
      tags: [Onboarding]
      summary: Verify Aadhaar OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/step/4:
    patch:
      tags: [Onboarding]
      summary: Update Step 4 (Bank Account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /onboarding/kyb/verify-bank:
    post:
      tags: [Onboarding]
      summary: Verify Bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountNumber:
                  type: string
                ifsc:
                  type: string
      responses:
        "200":
          description: Success
  /onboarding/step/5:
    patch:
      tags: [Onboarding]
      summary: Update Step 5 (Brand & Logistics)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /onboarding/upload/logo:
    post:
      tags: [Onboarding]
      summary: Upload logo
      responses:
        "200":
          description: Success
  /onboarding/step/6:
    patch:
      tags: [Onboarding]
      summary: Update Step 6 (Agreements)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Success
  /dashboard/settlement-breakdown:
    get:
      tags: [Dashboard]
      summary: Get settlement breakdown
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month]
      responses:
        "200":
          description: Success
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, ACTIVE, INACTIVE, OUT_OF_STOCK]
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Success
    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sku:
                  type: string
                price:
                  type: number
              required: [name, sku, price]
      responses:
        "201":
          description: Created
  /products/{id}:
    get:
      tags: [Products]
      summary: Get product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
    patch:
      tags: [Products]
      summary: Update product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /products/{id}/variants/{variantId}:
    patch:
      tags: [Products]
      summary: Update product variant
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: variantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stockQty:
                  type: integer
                price:
                  type: number
      responses:
        "200":
          description: Success
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, PENDING, PACKED, SHIPPED, DELIVERED, CANCELLED, RETURNED]
      responses:
        "200":
          description: Success
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [PENDING, PACKED, SHIPPED, DELIVERED, CANCELLED, RETURNED]
                trackingNumber:
                  type: string
                courier:
                  type: string
              required: [status]
      responses:
        "200":
          description: Success
  /inventory/alerts:
    get:
      tags: [Inventory]
      summary: Get low stock alerts
      responses:
        "200":
          description: Success
  /inventory/restock:
    patch:
      tags: [Inventory]
      summary: Restock product/variant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                variantId:
                  type: string
                quantity:
                  type: integer
              required: [productId, quantity]
      responses:
        "200":
          description: Success
  /settlements:
    get:
      tags: [Settlements]
      summary: List settlements
      parameters:
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, PENDING, PAID, REVERSED, FAILED]
      responses:
        "200":
          description: Success
  /returns:
    get:
      tags: [Returns]
      summary: List returns
      parameters:
        - in: query
          name: page
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ALL, REQUESTED, APPROVED, REJECTED, RECEIVED, REFUNDED]
      responses:
        "200":
          description: Success
  /returns/{id}/status:
    patch:
      tags: [Returns]
      summary: Update return status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, RECEIVED, REFUNDED]
              required: [status]
      responses:
        "200":
          description: Success
  /notifications:
    get:
      tags: [Notifications]
      summary: Get notifications
      responses:
        "200":
          description: Success
  /notifications/mark-all-read:
    post:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        "200":
          description: Success
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
  /settings/profile:
    get:
      tags: [Settings]
      summary: Get settings profile
      responses:
        "200":
          description: Success
  /settings:
    get:
      tags: [Settings]
      summary: Get settings
      responses:
        "200":
          description: Success
    patch:
      tags: [Settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyLowStock:
                  type: boolean
                notifyNewOrder:
                  type: boolean
                notifySettlement:
                  type: boolean
      responses:
        "200":
          description: Success
  /bbps/session:
    post:
      tags: [BBPS]
      summary: Create a one-time Setu BillPay link for the logged-in user (user JWT)
      description: >-
        Uses the user's verified phone and `custID = user.id`. Open `link` in a webview.
        In stub mode a fake link is returned; in real mode a Setu failure is a 502, never fake data.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryName:
                  type: string
                  minLength: 1
                  maxLength: 100
                billerId:
                  type: string
                  minLength: 1
                  maxLength: 100
                redirectTo:
                  type: string
                  enum: [transactions, disputes]
      responses:
        "200":
          description: Link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  link:
                    type: string
                  sessionId:
                    type: string
                required: [success, link, sessionId]
        "400":
          description: Validation error, or PHONE_NOT_VERIFIED / INVALID_PHONE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillpayErrorResponse"
        "401":
          description: Missing or invalid user JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillpayErrorResponse"
        "502":
          description: SETU_UNAVAILABLE — Setu Create link failed (real mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillpayErrorResponse"
  /bbps/history:
    get:
      tags: [BBPS]
      summary: The caller's last 50 bill payments, newest first (user JWT)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  history:
                    type: array
                    maxItems: 50
                    items:
                      $ref: "#/components/schemas/BillpayHistoryItem"
                required: [success, history]
        "401":
          description: Missing or invalid user JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bbps/history/{id}:
    get:
      tags: [BBPS]
      summary: One of the caller's bill payments (user JWT)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  payment:
                    $ref: "#/components/schemas/BillpayHistoryItem"
                required: [success, payment]
        "401":
          description: Missing or invalid user JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found, or not the caller's payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: false
                  error:
                    type: string
  /webhooks/setu/billpay:
    post:
      tags: [BBPS]
      summary: Setu BillPay webhook (called by Setu)
      description: >-
        Idempotent: each event is stored once (dedupe key `event:(txnId|orderId|referenceId|refId|sessionId)`);
        re-deliveries answer `duplicate`. Payment status only moves forward
        (PENDING → SUCCESS | FAILED, FAILED → SUCCESS on bill_payment_success, SUCCESS → REFUNDED).
        Unknown events are stored and acknowledged. All payload values are strings.
      security:
        - BillpayWebhookApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum:
                    - bill_fetch_success
                    - bill_fetch_failure
                    - bill_collection_failure
                    - bill_payment_success
                    - bill_payment_failure
                    - bill_payment_refunded
                    - dispute_raised
                    - dispute_status_change
                status:
                  type: string
                txnId:
                  type: string
                orderId:
                  type: string
                refId:
                  type: string
                sessionId:
                  type: string
                customerId:
                  type: string
                  description: Our User.id (custID sent in Create link)
                mobileNumber:
                  type: string
                billerId:
                  type: string
                billerName:
                  type: string
                billerCategory:
                  type: string
                billAmount:
                  type: string
                amountPaid:
                  type: string
                paidOn:
                  type: string
                  description: DD-MM-YYYY HH:mm:ss (IST)
                error:
                  description: Plain string, JSON string or object
                referenceId:
                  type: string
                issueType:
                  type: string
                txnDate:
                  type: string
              required: [event]
              additionalProperties: true
      responses:
        "200":
          description: Stored (and processed) or a duplicate re-delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [acknowledged, duplicate]
                required: [status]
        "400":
          description: Body is not a JSON object, or `event` is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or wrong X-BILL-WEBHOOK-API-KEY, or no key configured on our side
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Processing failed after the event was stored; Setu retries and the retry reprocesses it
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: error
  /mall/quote:
    post:
      tags: [Mall]
      summary: Server-priced cart breakdown (spec 003)
      description: User JWT optional (required for useCashback and exchange). Client prices are ignored.
      security: [{ BearerAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MallCartRequest" }
      responses:
        "200":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MallQuote" }
        "400": { description: Invalid cart / coupon, content: { application/json: { schema: { $ref: "#/components/schemas/PricingError" } } } }
        "401": { description: Cashback needs sign-in, content: { application/json: { schema: { $ref: "#/components/schemas/PricingError" } } } }
        "404": { description: Unknown product, content: { application/json: { schema: { $ref: "#/components/schemas/PricingError" } } } }
        "409": { description: Unavailable product, stock, unpayable seller, exchange not eligible, content: { application/json: { schema: { $ref: "#/components/schemas/PricingError" } } } }
  /payment/create-order:
    post:
      tags: [Mall]
      summary: Create the Razorpay order for the server-priced cart
      description: User JWT required in production. A client `amount` (paise) or `quote_id` must match the server total, else 409 PRICE_CHANGED.
      security: [{ BearerAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MallCartRequest"
                - type: object
                  properties:
                    quote_id: { type: string }
                    amount: { type: integer, description: Optional, paise; must equal the server total }
                    customer_name: { type: string }
                    customer_email: { type: string }
                    customer_phone: { type: string }
                    delivery_address: { type: string }
                    pincode: { type: string }
                    city: { type: string }
      responses:
        "200":
          description: Razorpay order
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  order_id: { type: string }
                  amount: { type: integer, description: paise }
                  amount_in_paise: { type: integer }
                  currency: { type: string }
                  key_id: { type: string }
                  customer_id: { type: [string, "null"], description: Pass to Razorpay Checkout for saved cards }
                  quote: { $ref: "#/components/schemas/MallQuote" }
        "401": { description: Sign-in required (production) }
        "409": { description: PRICE_CHANGED or cart error, content: { application/json: { schema: { $ref: "#/components/schemas/PricingError" } } } }
  /payment/pay-with-card:
    post:
      tags: [Mall]
      summary: Saved-card checkout with server pricing (amount in rupees, optional)
      security: [{ BearerAuth: [] }, {}]
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MallCartRequest"
                - type: object
                  properties:
                    card_id: { type: string }
                    token_id: { type: string }
                    amount: { type: number, description: rupees }
                    amount_in_paise: { type: integer }
      responses:
        "200": { description: "requires_checkout (real) or requires_otp (stub); includes customer_id, token_id, quote" }
        "404": { description: CARD_NOT_FOUND (not the caller's card) }
        "409": { description: PRICE_CHANGED }
  /payment/verify-payment:
    post:
      tags: [Mall]
      summary: Verify signature, confirm capture with Razorpay, fulfil once
      responses:
        "200": { description: Fulfilled (or duplicate) }
        "202": { description: Being fulfilled by another caller }
        "403": { description: WRONG_USER }
        "409": { description: "Rejected and fully refunded: { refunded: true, code, refund_id }" }
  /user/orders/my-orders:
    get:
      tags: [Buyer]
      summary: The signed-in buyer's orders (scoped by Order.userId)
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  orders: { type: array, items: { $ref: "#/components/schemas/UserOrder" } }
                  next_cursor: { type: [string, "null"] }
        "401": { description: User JWT required }
  /user/orders/{id}:
    get:
      tags: [Buyer]
      summary: One of the buyer's orders (id or order number)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ success, order: UserOrder }" }
        "404": { description: Not found or not the caller's }
  /rewards/balance:
    get:
      tags: [Rewards]
      summary: The caller's ledger CI Points and cashback (phone query ignored)
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  phone: { type: [string, "null"] }
                  ci_points: { type: integer }
                  cashback_balance: { type: number }
                  source: { type: string, const: ledger }
        "401": { description: User JWT required }
  /rewards/initiate-redemption:
    post:
      tags: [Rewards]
      summary: Price a reward from the DB (points = round(price)) and create the fee order
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                variantId: { type: string }
                pointsRequired: { type: integer, description: Optional; must match the server value }
                delivery_option: { type: string, enum: [standard, express] }
      responses:
        "200": { description: "{ order_id, amount (1179|6179 paise), points_required, product_value, customer_id, platform_fee_breakdown }" }
        "400": { description: INSUFFICIENT_POINTS }
        "401": { description: User JWT required }
        "404": { description: UNKNOWN_PRODUCT }
        "409": { description: PRICE_CHANGED or product unavailable }
  /cards/saved:
    get:
      tags: [Cards]
      summary: The caller's Razorpay customer tokens
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  customer_id: { type: [string, "null"] }
                  cards: { type: array, items: { $ref: "#/components/schemas/SavedCard" } }
  /cards/save:
    post:
      tags: [Cards]
      summary: Retired - cards are saved in Razorpay Checkout
      responses:
        "410": { description: CARD_SAVE_IN_CHECKOUT }
  /cards/{id}:
    delete:
      tags: [Cards]
      summary: Delete one of the caller's tokens at Razorpay
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200": { description: Removed }
        "404": { description: Not the caller's card }
  /returns/exchange/eligibility:
    get:
      tags: [Returns]
      summary: Exchange pre-check (also POST with the same fields in the body)
      parameters:
        - { in: query, name: orderId, schema: { type: string } }
        - { in: query, name: orderNumber, schema: { type: string } }
        - { in: query, name: newProductId, schema: { type: string } }
        - { in: query, name: newVariantId, schema: { type: string } }
      responses:
        "200":
          description: Eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeEligibility" }
        "401": { description: User JWT required }
  /returns/exchange:
    post:
      tags: [Returns]
      summary: File an exchange (eligibility re-checked)
      responses:
        "201": { description: Filed }
        "200": { description: Already filed by the exchange checkout (already_processed true) }
        "402": { description: PAYMENT_REQUIRED - pay the difference through create-order with exchange }
        "409": { description: EXCHANGE_NOT_ELIGIBLE }
  /admin/checkouts:
    get:
      tags: [Admin]
      summary: Stuck / failed checkouts
      parameters:
        - { in: query, name: status, schema: { type: string, default: stuck } }
      responses:
        "200": { description: List }
  /admin/checkouts/{razorpayOrderId}/resume:
    post:
      tags: [Admin]
      summary: Resume fulfilment (expired lease / FAILED) or retry pending seller transfers
      parameters:
        - { in: path, name: razorpayOrderId, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paymentId: { type: string }
                force: { type: boolean, description: Expire a live lease first }
      responses:
        "200": { description: "{ state, result } or { state: FULFILLED, transfers }" }
        "409": { description: Live lease held, refunded checkout, or no payment recorded }
